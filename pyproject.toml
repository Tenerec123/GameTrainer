[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gametrainer"
version = "0.1.0"
description = "A library to create and train an AI to play games (MCTS, Model Creation, Train Loop)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
nn = [
    "torch>=2.0",
]